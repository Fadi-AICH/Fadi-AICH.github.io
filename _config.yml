title: Fadi AICH
tagline: "Cybersecurity Engineering · Cloud Security"
description: >-
  Cybersecurity engineering portfolio by Fadi AICH — security projects, cloud labs, technical write-ups, and certifications.
url: ""
baseurl: ""
github_username: Fadi-AICH

avatar: /assets/img/fadix.jpg

theme_mode: dark

# Navigation tabs
tabs:
  - title: Home
    url: /
    icon: fas fa-home
  - title: Projects
    url: /projects/
    icon: fas fa-code
  - title: Categories
    url: /categories/
    icon: fas fa-stream
  - title: Certifications
    url: /certifications/
    icon: fas fa-certificate
  - title: Archives
    url: /archives/
    icon: fas fa-archive
  - title: About
    url: /about/
    icon: fas fa-info-circle

# Social links
social:
  github: https://github.com/Fadi-AICH
  linkedin: https://linkedin.com/in/fadix
  tryhackme: https://tryhackme.com/p/FadiX
  hackthebox: https://app.hackthebox.com/profile/FadiX

# Build
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: "_tabs"
    values:
      layout: page
      permalink: /:title/

collections: {}

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
