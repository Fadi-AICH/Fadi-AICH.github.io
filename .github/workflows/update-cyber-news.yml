name: Update Notion Cyber News

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "notion-cyber-news/update_news.py"
      - ".github/workflows/update-cyber-news.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update RSS snapshot
        run: python3 notion-cyber-news/update_news.py

      - name: Commit refreshed news
        run: |
          if git diff --quiet -- notion-cyber-news/news.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notion-cyber-news/news.json
          git commit -m "chore: refresh cybersecurity news [skip ci]"
          git push
