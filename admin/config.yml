backend:
  name: github
  repo: Fadi-AICH/Fadi-AICH.github.io
  branch: main
  base_url: https://fadi-aich-github-io.pages.dev
  auth_endpoint: /auth

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  # --- Write-ups, Notes & Project Case Studies ---
  - name: "posts"
    label: "Write-ups & Notes"
    label_singular: "Note / Case Study"
    folder: "_posts"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image", required: false, hint: "Local banner / screenshot from assets/img" }
      - { label: "External Image URL", name: "external_image", widget: "string", required: false, hint: "Optional raw GitHub/external thumbnail URL for project posts" }
      - { label: "Custom Permalink", name: "permalink", widget: "string", required: false, hint: "Stable route such as /projects/my-project/" }
      - { label: "Project Case Study", name: "case_study", widget: "boolean", required: false, default: false, hint: "Enables the detailed case-study UI" }
      - { label: "Hide Top Banner", name: "hide_banner", widget: "boolean", required: false, default: false, hint: "Useful for case studies that explain the project before showing evidence" }
      - label: "Certification"
        name: "certification"
        widget: "select"
        required: false
        hint: "Link this note to a certification"
        options:
          - "Google Cybersecurity Certificate"
          - "AWS Certified Solutions Architect - Associate (SAA-C03)"
      - label: "Categories"
        name: "categories"
        widget: "select"
        multiple: true
        min: 1
        options:
          - "Projects"
          - "Cybersecurity"
          - "MLOps"
          - "Software"
          - "Full-Stack"
          - "TryHackMe"
          - "HackTheBox"
          - "Cyber Notes"
          - "Linux"
          - "Networking"
          - "Python Hacking"
          - "Windows"
          - "Web Security"
          - "OSINT"
          - "Active Directory"
          - "Forensics"
          - "Cryptography"
          - "Reverse Engineering"
          - "Malware Analysis"
          - "Cloud Security"
      - label: "Subcategory"
        name: "subcategory"
        widget: "string"
        required: false
        hint: "Group notes under a subsection (e.g. Cyber Security 101, OWASP Module)"
      - label: "Difficulty"
        name: "difficulty"
        widget: "select"
        required: false
        options:
          - "Facile"
          - "Medium"
          - "Hard"
      - { label: "Tags", name: "tags", widget: "list", allow_add: true, hint: "Press Enter after each tag" }
      - { label: "Table of Contents", name: "toc", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown", modes: ["raw", "rich_text"] }

  # --- Certifications ---
  - name: "certifications"
    label: "Certifications"
    files:
      - name: "cert-roadmap"
        label: "Certification Roadmap"
        file: "_data/certifications.yml"
        description: "Add, edit or reorder your certifications"
        fields:
          - label: "Certifications"
            name: "items"
            widget: "list"
            allow_add: true
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string", hint: "URL-safe identifier. It should match an existing detail page when the card is clickable." }
              - { label: "Provider", name: "provider", widget: "string" }
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Completed", value: "completed" }
                  - { label: "In Progress", value: "in-progress" }
                  - { label: "Not Started", value: "not-started" }
              - { label: "Description", name: "description", widget: "string", required: false }

  # --- Categories Manager ---
  - name: "categories"
    label: "Categories"
    files:
      - name: "categories-list"
        label: "Manage Categories"
        file: "_data/categories.yml"
        description: "Add or edit curated categories with optional images and descriptions"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            allow_add: true
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Image", name: "image", widget: "image", required: false, hint: "Category banner" }
              - { label: "Description", name: "description", widget: "string", required: false }
